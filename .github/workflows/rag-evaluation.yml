name: LabGuard AI - RAGAS Evaluation

on:
  push:
    branches:
      - main
    paths:
      - "rag/**"
      - "evaluate_rag.py"
      - "requirements-rag-evaluation.txt"
      - "FICHE_Cas_Glucose.docx"
      - "FICHE-LAB-ANOM-001.docx"
      - "Procedure_anomalies_detection.docx"
      - ".github/workflows/rag-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragas-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-rag-evaluation.txt

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rag-evaluation.txt

      - name: Run RAGAS evaluation with real Mistral API calls
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python evaluate_rag.py

      - name: Upload RAGAS evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labguard-ragas-report-${{ github.run_number }}
          path: rag-evaluation-results/
          if-no-files-found: warn
          retention-days: 30
